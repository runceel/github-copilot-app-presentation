<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture Editor</title>
  <link rel="stylesheet" href="/renderer/slides.css">
  <link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
  <header class="editor-header">
    <div class="editor-title">
      <strong>Architecture Editor</strong>
      <span id="sourceLabel"></span>
      <span id="dirtyBadge" class="dirty-badge" hidden>未保存</span>
    </div>
    <div class="editor-actions" role="toolbar" aria-label="Architecture 編集操作">
      <button type="button" data-action="undo" title="元に戻す (Ctrl+Z)">↶</button>
      <button type="button" data-action="redo" title="やり直す (Ctrl+Y)">↷</button>
      <span class="toolbar-separator" aria-hidden="true"></span>
      <button type="button" data-action="add-node">ノード</button>
      <button type="button" data-action="add-group">グループ</button>
      <button type="button" data-action="add-image">画像</button>
      <button type="button" data-action="add-connector">コネクター</button>
      <button type="button" data-action="duplicate" title="複製 (Ctrl+D)">複製</button>
      <button type="button" data-action="delete" title="削除 (Delete)">削除</button>
      <button type="button" data-action="release-layout">レイアウト解除</button>
      <span class="toolbar-separator" aria-hidden="true"></span>
      <button type="button" data-action="order-back" title="宣言順を前へ">背面</button>
      <button type="button" data-action="order-front" title="宣言順を後へ">前面</button>
      <span class="toolbar-separator" aria-hidden="true"></span>
      <button type="button" data-action="zoom-out" aria-label="縮小">−</button>
      <button type="button" data-action="zoom-fit">全体</button>
      <button type="button" data-action="zoom-in" aria-label="拡大">＋</button>
      <label class="snap-toggle"><input id="snapToggle" type="checkbox" checked> グリッド</label>
      <button type="button" class="save-button" data-action="save" title="Markdown に保存 (Ctrl+S)">保存</button>
    </div>
  </header>

  <main class="editor-layout">
    <aside class="editor-sidebar element-panel" aria-label="要素">
      <h2>要素</h2>
      <div id="elementTree" class="element-tree" role="tree"></div>
    </aside>

    <section id="viewport" class="editor-viewport" aria-label="作図面">
      <div id="canvasSurface" class="canvas-surface"></div>
    </section>

    <aside class="editor-sidebar inspector-panel" aria-label="プロパティ">
      <h2>プロパティ</h2>
      <form id="inspector" class="inspector" autocomplete="off"></form>
    </aside>
  </main>

  <footer class="editor-footer">
    <span id="status" role="status" aria-live="polite">読み込み中…</span>
    <span id="zoomStatus">100%</span>
  </footer>

  <div id="contextMenu" class="context-menu" role="menu" aria-label="編集操作" tabindex="-1" hidden></div>

  <dialog id="assetDialog" class="asset-dialog" aria-labelledby="assetDialogTitle">
    <div class="asset-dialog-header">
      <div>
        <h2 id="assetDialogTitle">画像を選択</h2>
        <p>workspace の assets/ にある画像を選択するか、PC から取り込みます。</p>
      </div>
      <button id="assetDialogClose" type="button" aria-label="画像選択を閉じる">×</button>
    </div>
    <div class="asset-dialog-tools">
      <label for="assetSearch">画像を検索</label>
      <input id="assetSearch" type="search" placeholder="ファイル名またはパス">
      <button id="assetImportButton" type="button">PC から取り込み</button>
      <input id="assetFileInput" type="file" accept=".svg,.png,.webp,.jpg,.jpeg,image/svg+xml,image/png,image/webp,image/jpeg" hidden>
    </div>
    <div class="asset-dialog-body">
      <div id="assetList" class="asset-list" role="listbox" aria-label="利用できる画像"></div>
      <div class="asset-preview">
        <div class="asset-preview-frame">
          <div id="assetPreviewImageHost"></div>
          <span id="assetPreviewEmpty">画像を選択してください</span>
        </div>
        <p id="assetPreviewPath"></p>
      </div>
    </div>
    <div class="asset-dialog-footer">
      <span id="assetDialogStatus" role="status" aria-live="polite"></span>
      <div>
        <button id="assetCancelButton" type="button">キャンセル</button>
        <button id="assetChooseButton" class="save-button" type="button" disabled>選択</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/editor/editor.js"></script>
</body>
</html>
