<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>presentation</title>
  <link rel="stylesheet" href="./renderer/slides.css">
</head>
<body class="mermaid-loading" tabindex="-1">
  <div id="stage"></div>

  <!-- In-canvas navigation controls (persist across slide re-renders). -->
  <nav id="nav" class="nav" hidden aria-label="スライド操作">
    <button id="navPrev" class="nav-btn" type="button" title="前へ (←)" aria-label="前のスライド">&#9664;</button>
    <span id="navCounter" class="nav-counter" aria-live="polite"></span>
    <button id="navNext" class="nav-btn" type="button" title="次へ (→)" aria-label="次のスライド">&#9654;</button>
    <button id="navEdit" class="nav-btn" type="button" title="図形編集モード" aria-label="図形編集モード">&#x270E;</button>
    <button id="navPresent" class="nav-btn" type="button" title="外部ウィンドウで表示 (F11 で全画面)" aria-label="外部ウィンドウで表示">&#x26F6;</button>
    <button id="navPresenterView" class="nav-btn" type="button" title="発表者ビュー" aria-label="発表者ビュー">&#128100;</button>
    <button id="navExport" class="nav-btn" type="button" title="PDFに保存" aria-label="PDFに保存">&#128438;</button>
    <button id="navImport" class="nav-btn" type="button" title="Markdown を読み込む (I)" aria-label="Markdown を読み込む">&#128193;</button>
    <button id="navSourceMode" class="nav-btn" type="button" title="Markdown の保存時に自動更新する" aria-label="Markdown の保存時に自動更新する" hidden>&#8635;</button>
    <button id="navList" class="nav-btn" type="button" title="スライド一覧 (O)" aria-label="スライド一覧">&#9776;</button>
    <span id="presentStatus" class="sr-only" aria-live="polite"></span>
    <span id="exportStatus" class="sr-only" aria-live="polite"></span>
    <span id="sourceStatus" class="sr-only" aria-live="polite"></span>
  </nav>

  <section id="presenterView" class="presenter-view" hidden aria-label="発表者ビュー">
    <header class="presenter-view-head">
      <h1>発表者ビュー</h1>
      <button id="presenterReturnButton" class="presenter-button" type="button">スライド表示に戻る</button>
    </header>
    <div class="presenter-previews">
      <section class="presenter-preview presenter-preview-current" aria-labelledby="presenterCurrentLabel">
        <h2 id="presenterCurrentLabel">現在のスライド</h2>
        <iframe id="presenterCurrent" class="presenter-frame" title="現在のスライド"></iframe>
      </section>
      <div class="presenter-sidebar">
        <section class="presenter-preview" aria-labelledby="presenterNextLabel">
          <h2 id="presenterNextLabel">次のスライド</h2>
          <iframe id="presenterNext" class="presenter-frame" title="次のスライド"></iframe>
          <p id="presenterNextEmpty" class="presenter-next-empty" hidden>次のスライドはありません</p>
        </section>
        <section class="presenter-notes" aria-labelledby="presenterNotesLabel">
          <h2 id="presenterNotesLabel">スピーカーノート</h2>
          <div id="presenterNotes" class="presenter-notes-body" tabindex="0" aria-live="polite"></div>
          <p id="presenterNotesEmpty" class="presenter-notes-empty">スピーカーノートはありません</p>
        </section>
      </div>
    </div>
    <footer class="presenter-controls" aria-label="発表者ビューの操作">
      <button id="presenterPrevButton" class="presenter-button" type="button">前へ</button>
      <span id="presenterCounter" class="presenter-counter" aria-live="polite"></span>
      <button id="presenterNextButton" class="presenter-button" type="button">次へ</button>
      <button id="presenterListButton" class="presenter-button" type="button">スライド一覧</button>
      <button id="presenterToggleButton" class="presenter-button presenter-toggle" type="button">プレゼンを開始</button>
    </footer>
  </section>

  <!-- Slide-list overview overlay, toggled from the control bar / keyboard. -->
  <div id="overview" class="overview" hidden>
    <div class="overview-panel" role="dialog" aria-modal="true" aria-label="スライド一覧">
      <div class="overview-head">
        <span>スライド一覧</span>
        <button id="overviewClose" class="nav-btn" type="button" title="閉じる (Esc)" aria-label="閉じる">&#10005;</button>
      </div>
      <ol id="overviewList" class="overview-list"></ol>
    </div>
  </div>

  <!-- Markdown import overlay: pick a *.md from the workspace and show it. -->
  <div id="importPicker" class="overview" hidden>
    <div class="overview-panel" role="dialog" aria-modal="true" aria-label="Markdown を読み込む">
      <div class="overview-head">
        <span>Markdown を読み込む</span>
        <button id="importClose" class="nav-btn" type="button" title="閉じる (Esc)" aria-label="閉じる">&#10005;</button>
      </div>
      <fieldset class="import-mode">
        <legend>保存時の表示更新</legend>
        <label><input id="importModeSnapshot" type="radio" name="importMode" value="snapshot" checked> 読み込み時点を保持</label>
        <label><input type="radio" name="importMode" value="live"> 保存時に自動更新</label>
      </fieldset>
      <input id="importFilter" class="import-filter" type="search" placeholder="ファイル名で絞り込み" aria-label="ファイル名で絞り込み" autocomplete="off">
      <p id="importMessage" class="import-message" role="status" aria-live="polite"></p>
      <ol id="importList" class="overview-list"></ol>
    </div>
  </div>

  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script src="./vendor/mermaid.min.js"></script>
  <script type="module" src="./renderer/renderer.js"></script>
</body>
</html>
