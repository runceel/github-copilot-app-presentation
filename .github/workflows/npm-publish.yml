name: Publish MarkdStage CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'runceel/markdstage'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: npm with Trusted Publishing support
        run: npm install --global npm@11.6.3

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/markdstage-cli/package.json').version")
          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $stable_semver ]]; then
            echo "Package version $version is not a stable MAJOR.MINOR.PATCH version."
            exit 1
          fi
          expected="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version."
            echo "Expected tag: $expected"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "The tagged commit must be reachable from origin/main."
            exit 1
          }

      - name: CLI tests
        run: npm run test:cli

      - name: Generated Agent Skills are up to date
        run: npm run skills:check

      - name: Review package contents
        working-directory: packages/markdstage-cli
        run: npm pack --dry-run

      - name: Publish package
        working-directory: packages/markdstage-cli
        run: npm publish --access public --provenance

      - name: Verify published version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/markdstage-cli/package.json').version")
          for attempt in {1..12}; do
            if published=$(npm view "@markdstage/markdstage@${version}" version \
              --registry=https://registry.npmjs.org/ 2>/dev/null) &&
              [ "$published" = "$version" ]; then
              echo "Verified @markdstage/markdstage@$version."
              exit 0
            fi
            echo "Waiting for npm registry propagation ($attempt/12)..."
            sleep 5
          done
          echo "Published version $version was not visible after 60 seconds."
          exit 1
