name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    # ビジュアル回帰のスクリーンショットはフォント構成に強く依存するため、runner を
    # 固定したうえで Playwright 公式コンテナー（ブラウザーとフォントを同梱）で実行する。
    # ローカルでのベースライン更新も同じイメージで行う（npm run test:visual:update:linux）。
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host

    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: 依存関係のインストール
        run: npm ci

      - name: 拡張機能に実行時 npm 依存がないことを確認
        # 拡張はフォルダーごと ZIP で配布され、利用者環境でそのまま動く必要がある。
        run: |
          set -e
          found=$(find .github/extensions/presentation \
            \( -name package.json -o -name package-lock.json -o -name node_modules \) -print)
          if [ -n "$found" ]; then
            echo "拡張ディレクトリに npm 依存が混入しています:"
            echo "$found"
            exit 1
          fi
          echo "OK: 拡張ディレクトリに npm 依存はありません。"

      - name: vendor 資産の整合性検証
        # 分割された mermaid チャンクが壊れていると、後段のビジュアル回帰が
        # 原因の分かりにくいタイムアウトで落ちるため先に検出する。
        run: npm run test:vendor

      - name: Architecture DSL スキーマ検証
        # JSON Schema と parseArchitecture の判定が一致していることを固定する。
        # 乖離を放置するとスキーマが仕様として信用できなくなるため、単体テストより先に流す。
        run: npm run test:schema

      - name: 単体テスト
        run: npm run test:unit

      - name: 編集ワークフロー回帰
        # 編集 UI が presenter / 印刷へ漏れていないことを含めて、ブラウザー上の
        # 振る舞いを固定する。ビジュアル回帰より先に流して原因を切り分けやすくする。
        run: npm run test:editing

      - name: ビジュアル回帰
        run: npm run test:visual

      - name: アクセシビリティと出力の等価性
        # axe-core の自動チェックと、Chromium のアクセシビリティツリー（CDP）を
        # 根拠にした読み上げ内容・順序・到達性の検証。あわせて canvas / presenter /
        # 印刷が同じ意味構造と同じ描画寸法を出すこと（WYSIWYG）も固定する。
        run: npm run test:a11y

      - name: 描画コストのバジェット
        # レイアウトと配線が要素数に対して二乗・指数に転んでいないことを見る。
        # 見た目は壊れないためビジュアル回帰では捕まらない種類の劣化を検出する。
        run: npm run test:perf

      - name: PDF 回帰
        run: npm run test:pdf

      - name: 失敗時のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
