<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description">
  <title id="title">Presentation app icon</title>
  <desc id="description">A stack of presentation slides with a prominent forward navigation arrow.</desc>

  <defs>
    <linearGradient id="background" x1="128" y1="96" x2="896" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.52" stop-color="#5745E8"/>
      <stop offset="1" stop-color="#3525B5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(806 164) rotate(132) scale(560)">
      <stop stop-color="#FF72C6" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FF72C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chart" x1="272" y1="516" x2="526" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6654EA"/>
      <stop offset="1" stop-color="#2DCDB0"/>
    </linearGradient>
  </defs>

  <!-- Rounded brand tile. The clear edge keeps the silhouette legible at 16 px. -->
  <rect x="56" y="56" width="912" height="912" rx="216" fill="url(#background)"/>
  <rect x="56" y="56" width="912" height="912" rx="216" fill="url(#glow)"/>
  <path
    d="M103 689C254 843 466 914 733 875C824 861 901 824 957 783V968H56V634C69 653 84 671 103 689Z"
    fill="#1E176D"
    opacity="0.2"/>

  <!-- The offset sheet makes the mark read as a deck, rather than a single media-play glyph. -->
  <rect
    x="166"
    y="205"
    width="596"
    height="438"
    rx="70"
    fill="#C9C6FF"
    opacity="0.62"
    transform="rotate(-7 464 424)"/>

  <!-- Current slide. -->
  <rect x="194" y="164" width="632" height="468" rx="68" fill="#FFFFFF"/>
  <rect x="270" y="238" width="230" height="42" rx="21" fill="#5D4BE2"/>
  <rect x="270" y="307" width="148" height="28" rx="14" fill="#D8D6F8"/>
  <path
    d="M282 520V430M378 520V382M474 520V326"
    fill="none"
    stroke="url(#chart)"
    stroke-width="58"
    stroke-linecap="round"/>
  <path d="M260 550H548" fill="none" stroke="#D8D6F8" stroke-width="24" stroke-linecap="round"/>

  <!-- Forward control: deliberately oversized so the navigation intent survives taskbar scaling. -->
  <circle cx="724" cy="726" r="180" fill="#31E6B5" stroke="#FFFFFF" stroke-width="28"/>
  <path
    d="M627 726H802M742 655L813 726L742 797"
    fill="none"
    stroke="#172047"
    stroke-width="50"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
