<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Architecture image sample">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#123b66"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50e6ff"/>
      <stop offset="1" stop-color="#ffb900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="600" rx="36" fill="url(#background)"/>
  <circle cx="1030" cy="70" r="180" fill="#50e6ff" opacity="0.08"/>
  <circle cx="170" cy="560" r="210" fill="#ffb900" opacity="0.08"/>
  <text x="80" y="105" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="44" font-weight="700">Custom images in Architecture DSL</text>
  <text x="80" y="155" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="24">One asset can be a standalone image or a node icon.</text>
  <g filter="url(#shadow)">
    <rect x="90" y="235" width="260" height="170" rx="28" fill="#ffffff"/>
    <rect x="470" y="235" width="260" height="170" rx="28" fill="#ffffff"/>
    <rect x="850" y="235" width="260" height="170" rx="28" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round">
    <path d="M350 320 H470"/>
    <path d="M730 320 H850"/>
  </g>
  <g fill="#0078d4">
    <circle cx="320" cy="320" r="16"/>
    <circle cx="700" cy="320" r="16"/>
    <circle cx="1080" cy="320" r="16"/>
  </g>
  <g fill="#0f172a" font-family="Segoe UI, sans-serif" text-anchor="middle">
    <text x="220" y="305" font-size="30" font-weight="700">Asset</text>
    <text x="220" y="345" font-size="21">SVG / PNG / WebP</text>
    <text x="600" y="305" font-size="30" font-weight="700">Canvas</text>
    <text x="600" y="345" font-size="21">contain / cover / stretch</text>
    <text x="980" y="305" font-size="30" font-weight="700">Present</text>
    <text x="980" y="345" font-size="21">canvas / PDF</text>
  </g>
  <rect x="80" y="485" width="1040" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="540" fill="#dbeafe" font-family="Consolas, monospace" font-size="24">assets/architecture-image-sample.svg</text>
</svg>
